<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apple Fitness Display</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div class="header-meta">
          <div class="breadcrumbs">Sessions</div>
          <h1>Treningi</h1>
        </div>
        <div class="segmented" role="tablist" aria-label="Typ podglądu">
          <button class="segmented__item is-active" data-filter="all" role="tab">Wszystkie</button>
          <button class="segmented__item" data-filter="workout" role="tab">Treningi</button>
          <button class="segmented__item" data-filter="mind" role="tab">Mindfulness</button>
          <button class="segmented__item" data-filter="cycling" role="tab">Kolarstwo</button>
        </div>
        <p class="header-hint">
          Wybierz export XML z Apple Health. Plik jest przetwarzany lokalnie na serwerze i nie jest nigdzie wysyłany.
        </p>
        <label class="upload-card" for="workoutFile">
          <input id="workoutFile" type="file" accept=".xml" />
          <div class="upload-card__icon">⬆️</div>
          <div class="upload-card__body">
            <h2>Przeciągnij i upuść lub wybierz plik XML</h2>
            <p>Limit rozmiaru: 10 GB</p>
          </div>
        </label>
        <div id="uploadStatus" class="upload-status" aria-live="polite"></div>
      </header>

      <section id="summary" class="summary hidden" aria-live="polite">
        <div class="summary__tile">
          <div class="summary__label">Łączna liczba</div>
          <div class="summary__value" data-summary="count">0</div>
        </div>
        <div class="summary__tile">
          <div class="summary__label">Czas</div>
          <div class="summary__value" data-summary="duration">0:00</div>
        </div>
        <div class="summary__tile">
          <div class="summary__label">Kalorie</div>
          <div class="summary__value" data-summary="energy">0 kcal</div>
        </div>
        <div class="summary__tile">
          <div class="summary__label">Dystans</div>
          <div class="summary__value" data-summary="distance">0 km</div>
        </div>
      </section>

      <section id="workouts" class="workouts" aria-live="polite">
        <div class="empty-state">
          <h2>Brak danych treningowych</h2>
          <p>Załaduj plik exportu, aby zobaczyć listę treningów.</p>
        </div>
      </section>
    </main>
    <template id="workout-card-template">
      <article class="workout-card">
        <div class="workout-card__icon"></div>
        <div class="workout-card__content">
          <div class="workout-card__header">
            <h3 class="workout-card__title"></h3>
            <div class="workout-card__meta"></div>
          </div>
          <div class="workout-card__details"></div>
        </div>
        <div class="workout-card__metrics"></div>
      </article>
    </template>
    <script type="module" src="app.js"></script>
  </body>
</html>
